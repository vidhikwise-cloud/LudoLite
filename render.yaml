# Render blueprint.
#
# ONE web service plus a Postgres database. The Node service serves both the
# API and the built web client from the same origin, which means:
#
#   * no CORS to configure
#   * no proxy rules between two services
#   * no cross-service hostname to hardcode (Render's blueprint spec has no
#     documented way to interpolate another service's public URL into a
#     static-site rewrite, so a two-service split would need a manual edit
#     after every first deploy)
#   * websockets work without special routing
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo -> Apply.
#   3. Wait for the first deploy. The URL it gives you IS the app.
#
# PAID HOSTING STAYS DISABLED. The flag is pinned to false below, and even
# setting it to true would not open the gate without the two approval records
# in the database. See docs/COMPLIANCE.md.

databases:
  - name: ludo-db
    databaseName: ludo
    user: ludo
    # FREE TIER. Read this before relying on it:
    #
    #   * The database EXPIRES 30 days after creation, then has a 14-day
    #     grace period before deletion. Upgrade to a paid plan before then
    #     or the data is gone permanently.
    #   * One free database per Render workspace. If another project in this
    #     workspace already has one, this blueprint will fail to apply and
    #     the plan must go back to `basic-256mb`.
    #   * No backups, no connection pooling, 1 GB storage.
    #
    # Change to `basic-256mb` (~$6/mo) for anything beyond testing.
    plan: free
    # Stated explicitly so it is visible that this matches the web service's
    # region. The two must agree -- see the note on the service's `region`.
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: ludo
    # `node`, not `docker`: a repo with a Dockerfile would otherwise be
    # auto-detected as a Docker service, which skips preDeployCommand and so
    # never runs the migrations.
    runtime: node
    # FREE TIER -- deliberately chosen for first-deploy testing, but this is
    # a real downgrade for this app, not just a cheaper tier:
    #
    #   * Render spins the service down after 15 minutes without traffic,
    #     and a cold start takes ~1 minute. A sleeping server DROPS EVERY
    #     LIVE MATCH, because websocket connections do not survive it.
    #   * 750 instance-hours per workspace per month, shared with any other
    #     service in the workspace.
    #
    # Change to `starter` (~$7/mo) before real players use this.
    plan: free
    # MUST match the database's region. `DATABASE_URL` below resolves to a
    # private-network connection string, and private networking does not
    # cross regions: a Singapore service with an Oregon database fails with
    # `P1001: Can't reach database server`.
    #
    # Singapore is the closest region to India and is what this should use,
    # but the free database is created in Oregon regardless of the region
    # requested, so the service follows it there. Latency from India is
    # worse as a result. Moving both to Singapore means paying for Postgres.
    region: oregon
    branch: main

    # `--include=dev` is REQUIRED, not belt-and-braces.
    #
    # NODE_ENV is set to production below, and `npm ci` honours that by
    # installing dependencies only -- 125 of 746 packages. Everything that
    # builds this repo (typescript, vite, tsx) is a devDependency, so
    # without the flag the build fails three separate ways at once:
    # "This is not the tsc command you are looking for", "Cannot find type
    # definition file for 'vite/client'", and "sh: 1: tsx: not found".
    #
    # `npx tsc` is especially misleading here: with typescript absent, npx
    # silently downloads an unrelated `tsc` package from the registry and
    # runs that instead of failing, which is where that message comes from.
    #
    # The dev packages are build-time only; the running service still uses
    # just the production dependency tree.
    buildCommand: |
      npm ci --include=dev
      npx prisma generate --schema apps/server/prisma/schema.prisma
      npx tsc -p packages/engine/tsconfig.json
      npx tsc -p packages/shared/tsconfig.json
      npx tsc -p apps/server/tsconfig.json
      npm run build --workspace apps/web
      npm run db:deploy --workspace apps/server
      npm run db:seed --workspace apps/server

    # NOTE -- migrations run in buildCommand above, NOT in preDeployCommand.
    #
    # `preDeployCommand` is a PAID-ONLY feature ("available for paid web
    # services, private services, and background workers"). On the free plan
    # Render silently ignores it, the migrations never run, and the server
    # starts against an empty database -- which looks like a mysterious
    # runtime crash rather than a configuration problem.
    #
    # Running them in the build step is the free-tier workaround, with one
    # real tradeoff: the migration applies while the OLD version is still
    # serving traffic, instead of after build and before cutover. For a
    # single-instance app with no live users this is fine. When moving to a
    # paid plan, move these two lines back into `preDeployCommand`.
    #
    # Seeding is idempotent and never grants an approval.

    startCommand: node apps/server/dist/main.js

    # Readiness, not liveness: Render should route traffic only when the
    # database is reachable, and stop routing during a drain.
    healthCheckPath: /ready

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info

      - key: DATABASE_URL
        fromDatabase:
          name: ludo-db
          property: connectionString

      - key: SESSION_SECRET
        generateValue: true          # Render generates and stores it

      # Admin dashboard at /admin. Render generates the token; read it from
      # the dashboard (Environment tab) to log in.
      #
      # Removing this variable disables the dashboard entirely -- every
      # admin route 404s and the page stops being served. It fails closed
      # on purpose: the failure mode of a missing token would otherwise be
      # exposing player activity to the internet.
      - key: ADMIN_TOKEN
        generateValue: true

      # The web app is served from this same service, so it needs no CORS
      # entry. The Android app does: the Capacitor webview loads from the
      # origin `https://localhost`, so every API call it makes is
      # cross-origin and is rejected unless that origin is allowed here.
      #
      # Set to `https://localhost` from the start because the APK is part of
      # this deploy. Without it the Android app reaches the server and is
      # then refused by the browser's CORS check -- which surfaces in the
      # app as the same generic "could not reach the server" message as a
      # wrong URL, and is correspondingly annoying to diagnose.
      - key: CORS_ORIGINS
        value: 'https://localhost'

      # --- the gate ---------------------------------------------------------
      # Do not change these without reading docs/COMPLIANCE.md. Setting the
      # flag to true alone does NOT enable payments; the two approval records
      # are also required. Pinned here so a dashboard edit is deliberate.
      - key: PAID_ROOM_HOSTING_ENABLED
        value: false
      - key: PAYMENT_PROVIDER
        value: none
      - key: HOSTING_FEE_PAISE
        value: 100
      - key: CURRENCY
        value: INR
      - key: REFUND_WINDOW_MINUTES
        value: 60

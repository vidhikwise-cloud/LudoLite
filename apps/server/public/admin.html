<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Neutral: the tab title is visible in history and over a shoulder. -->
    <title>Console</title>
    <style>
      /*
       * Deliberately one self-contained file with no build step and no
       * dependencies. An internal tool that needs a toolchain is one that
       * rots the first time nobody has run `npm install` in six months.
       */
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --ink: #1c2024;
        --ink-2: #5b646e;
        --ink-3: #8b949e;
        --rule: #e3e7ec;
        --ok: #11803f;
        --warn: #9a6207;
        --bad: #c32733;
        --accent: #3f5ae0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        padding: 24px 16px 60px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: var(--ink-2); margin: 0 0 22px; font-size: 13.5px; }

      .gate { max-width: 380px; }
      input {
        width: 100%; padding: 11px 13px; border: 1px solid var(--rule);
        border-radius: 9px; font: inherit; background: var(--card);
      }
      button {
        padding: 11px 18px; border: 0; border-radius: 9px; background: var(--accent);
        color: #fff; font: 600 15px/1 inherit; cursor: pointer; margin-top: 10px;
      }
      button:hover { filter: brightness(1.08); }

      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 26px; }
      .stat { background: var(--card); border: 1px solid var(--rule); border-radius: 11px; padding: 14px 16px; }
      .stat b { display: block; font-size: 25px; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--ink-3); font-size: 12px; }

      h2 { font-size: 15px; margin: 26px 0 10px; }
      .tablewrap { background: var(--card); border: 1px solid var(--rule); border-radius: 11px; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
      th, td { text-align: left; padding: 10px 13px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
      th { color: var(--ink-3); font: 600 11px/1 inherit; letter-spacing: .07em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .mono { font-family: Consolas, monospace; font-size: 12px; color: var(--ink-2); }

      .pill { display: inline-block; padding: 3px 8px; border-radius: 99px; font: 600 11px/1.5 inherit; }
      .pill.ok { background: #e4f6ec; color: var(--ok); }
      .pill.warn { background: #fff3d9; color: var(--warn); }
      .pill.bad { background: #ffe9ea; color: var(--bad); }
      .pill.bot { background: #eef0f4; color: var(--ink-2); }

      .seats { display: flex; flex-wrap: wrap; gap: 5px; }
      .err { color: var(--bad); margin-top: 10px; font-size: 13.5px; }
      .muted { color: var(--ink-3); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!--
        The heading only appears once someone is in. Before that the page
        is a box and nothing else: a stranger who stumbles onto the URL
        should not be told what they have found or what it guards.
      -->
      <div id="head" hidden>
        <h1>LudoLite · Admin</h1>
        <p class="sub">
          Read-only. Device labels are hashed; no payment data, tokens, or IP
          addresses are shown.
        </p>
      </div>

      <div id="gate" class="gate">
        <!--
          Deliberately unlabelled: anyone who should be here already knows
          what goes in the box, and a label only tells a stranger what they
          have found. aria-label keeps it usable with a screen reader, which
          costs nothing -- someone operating one is not the threat model.
        -->
        <input
          id="tok"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Access key"
          autofocus
        />
        <button id="go">Enter</button>
        <div id="err" class="err"></div>
      </div>

      <div id="dash" hidden>
        <div class="stats" id="stats"></div>

        <h2>Recent matches</h2>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Started</th><th>Players</th><th>Outcome</th>
                <th>Moves</th><th>Length</th><th>Room</th>
              </tr>
            </thead>
            <tbody id="matches"></tbody>
          </table>
        </div>

        <h2>Players</h2>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Name</th><th>Device</th><th>Joined</th>
                <th>Hosted</th><th>Left early</th><th>First seen</th><th>Last seen</th>
              </tr>
            </thead>
            <tbody id="players"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!--
      External, not inline: the app sends a strict
      Content-Security-Policy with script-src 'self' and no
      'unsafe-inline'. An inline block here is refused by the browser,
      which left the page rendering with no behaviour at all. Loosening
      the policy to suit one internal page would weaken it for the whole
      game, so the script moved out instead.
    -->
    <script src="/admin-assets/admin.js"></script>
  </body>
</html>
